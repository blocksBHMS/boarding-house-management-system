name: bhns

services:
  # ---------- Vue frontend (nginx) ----------
  web:
    build:
      context: ./client/bhns
    image: ${DOCKERHUB_USERNAME}/bhns-client:${IMAGE_TAG:-latest}
    container_name: bhms_frontend
    restart: unless-stopped
    ports:
      - "5000:80"          
    depends_on:
      - backend
    networks:
      - bhns-net

  # ---------- Django / DRF backend ----------
  backend:
    build:
      context: ./server/boarding-house-management-system
    image: ${DOCKERHUB_USERNAME}/bhns-server:${IMAGE_TAG:-latest}
    container_name: bhms_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Error:DJANGO_SECRET_KEY is missing!}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DB_NAME: ${DB_NAME:?Error:DB_NAME is missing!}
      DB_USER: ${DB_USER:?Error:DB_USER is missing!}
      DB_PASSWORD: ${DB_PASSWORD:?Error:DB_PASSWORD is missing!}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      LANDLORD_PASSCODE: ${LANDLORD_PASSCODE:?LANDLORD_PASSCODE is missing!}
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bhns-net

  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: bhns-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Error:DB_NAME is missing!}
      POSTGRES_USER: ${DB_USER:?Error:DB_USER is missing!}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Error:DB_PASSWORD is missing!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?Error:DB_USER is missing!} -d ${DB_NAME:?Error:DB_NAME is missing!}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bhns-net

volumes:
  pgdata:

networks:
  bhns-net:
